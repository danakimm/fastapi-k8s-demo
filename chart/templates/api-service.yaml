apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastapi-pg.apiName" . }}
  labels:
    {{- include "fastapi-pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "fastapi-pg.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
