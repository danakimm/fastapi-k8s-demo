{{- if .Values.ingress.enabled }}
# 외부 → FastAPI 로만 들어오는 입구 (postgres로 가는 경로는 없음)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fastapi-pg.apiName" . }}
  labels:
    {{- include "fastapi-pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fastapi-pg.apiName" . }}
                port:
                  number: {{ .Values.api.service.port }}
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
