# ── FastAPI ─────────────────────────────────────────
api:
  replicaCount: 1
  image:
    repository: fastapi-app      # 배포 시 Nexus 이미지 주소로 덮어씀
    tag: "0.1.0"
    pullPolicy: IfNotPresent     # 빌드 번호처럼 변경되지 않는 태그 사용을 권장
  containerPort: 8000
  service:
    port: 80                     # ClusterIP (외부 공개는 Ingress가 담당)

# ── PostgreSQL ──────────────────────────────────────
postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: app
    password: change-me          # 연습용. 실무에선 values에 비밀번호를 두지 않음
    database: appdb
  storage:
    size: 1Gi
    storageClass: ""             # 비우면 k3s 기본 StorageClass(local-path) 사용
  service:
    port: 5432                   # ClusterIP → 클러스터 밖에서는 접근 불가

# ── 외부 입구 ───────────────────────────────────────
ingress:
  enabled: true
  className: traefik             # k3s 기본 Ingress Controller
  host: ""                       # 비우면 모든 호스트로 받음

# ── postgres에는 FastAPI Pod만 접근 허용 ─────────────
networkPolicy:
  enabled: true                  # k3s 기본 NetworkPolicy Controller에서 적용
